# Read the Docs configuration file
# See https://docs.readthedocs.io/en/stable/config-file/v2.html for details

version: 2

submodules:
  include:
    - data
    - samples
  recursive: false

build:
  os: ubuntu-22.04
  tools:
    python: "3.12"
  jobs:
    pre_build:
      - python tools/docs.py prepare --api-mode snapshot

python:
   install:
   - requirements: docs/requirements.txt

sphinx:
  configuration: docs/conf.py

formats:
  - pdf
