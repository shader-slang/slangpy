name: ci
run-name: CUDA target diagnosis on CI GPU
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnose:
    runs-on:
      labels: [Linux, X64, nvrgfx-kernelvm-bridge]
    env:
      CI_OS: linux
      CI_PLATFORM: x86_64
      CI_COMPILER: gcc
      CI_CONFIG: Release
      CI_PYTHON: '3.10'
      CI_FLAGS: unit-test
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
          lfs: true
      - uses: actions/setup-python@v6
        with:
          python-version: '3.10'
      - run: python -m pip install -r requirements-dev.txt
      - uses: lukka/get-cmake@latest
      - run: python tools/ci.py setup
      - run: python tools/ci.py configure
      - run: python tools/ci.py build
      - run: python tools/diagnose_cuda_target.py
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: cuda-target-diagnostics
          path: .tmp/cuda-diagnostics/
          include-hidden-files: true
