name: ci-latest-slang
run-name: "${{ github.event_name == 'repository_dispatch' && (github.event.client_payload.slang_pr_number && format('Slang PR #{0}: {1} ({2})', github.event.client_payload.slang_pr_number, github.event.client_payload.slang_pr_title || '?', github.event.client_payload.slang_pr_author || '?') || format('Slang ref: {0}', github.event.client_payload.slang_ref || github.event.client_payload.slang_commit_sha)) || format('Slang branch: {0}', github.event.inputs.slang_branch || 'master') }}"

on:
  schedule:
    - cron: '0 1 * * *' # run at 1 AM UTC
  workflow_dispatch:
    inputs:
      slang_branch:
        description: 'Slang branch'
        required: true
        default: 'master'
  repository_dispatch:
    types: [slang-pr-test]

permissions:
  contents: read
  checks: write
  id-token: write
  statuses: write

concurrency:
  group: ${{ github.event_name == 'repository_dispatch' && format('slang-{0}', github.event.client_payload.slang_pr_number || github.event.client_payload.slang_commit_sha) || github.run_id }}
  cancel-in-progress: true

jobs:
  # Full matrix for nightly and manual runs.
  build:
    if: github.event_name != 'repository_dispatch'
    runs-on: ${{ matrix.runs-on }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows, linux, macos]
        config: [Debug, Release]
        python: ["3.10"]
        include:
          - { os: windows, platform: x86_64, compiler: msvc, config: Debug, flags: "unit-test,header-validation,crashpad", runs-on: { labels: [Windows, X64, nvrgfx-kernelvm-bridge] } }
          - { os: windows, platform: x86_64, compiler: msvc, config: Release, flags: "unit-test,test-examples,crashpad", runs-on: { labels: [Windows, X64, nvrgfx-kernelvm-bridge] } }
          - { os: linux, platform: x86_64, compiler: gcc, config: Debug, flags: "unit-test,header-validation,coverage,crashpad", runs-on: { labels: [Linux, X64, nvrgfx-kernelvm-bridge] } }
          - { os: linux, platform: x86_64, compiler: gcc, config: Release, flags: "unit-test,test-examples,crashpad", runs-on: { labels: [Linux, X64, nvrgfx-kernelvm-bridge] } }
          - { os: macos, platform: aarch64, compiler: clang, config: Debug, flags: "unit-test,header-validation,crashpad", runs-on: macos-latest }
          - { os: macos, platform: aarch64, compiler: clang, config: Release, flags: "unit-test,test-examples,crashpad", runs-on: macos-latest }

    env:
      CI_OS: ${{ matrix.os }}
      CI_PLATFORM: ${{ matrix.platform }}
      CI_COMPILER: ${{ matrix.compiler }}
      CI_CONFIG: ${{ matrix.config }}
      CI_PYTHON: ${{ matrix.python }}
      CI_FLAGS: ${{ matrix.flags }}
      SLANG_PATH: ${{ github.workspace }}/slang/build/${{ matrix.config }}/bin

    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
          lfs: true

      - uses: ./.github/actions/build-and-test-with-slang
        with:
          os: ${{ matrix.os }}
          platform: ${{ matrix.platform }}
          compiler: ${{ matrix.compiler }}
          config: ${{ matrix.config }}
          python: ${{ matrix.python }}
          flags: ${{ matrix.flags }}
          shell: ${{ matrix.os == 'windows' && 'pwsh' || 'bash' }}
          slang-checkout-mode: branch
          slang-branch: ${{ github.event.inputs.slang_branch || 'master' }}

  # Reduced matrix for Slang PR testing (repository_dispatch).
  # Only Linux and Windows Release — Debug and macOS covered by nightly.
  build-pr:
    if: github.event_name == 'repository_dispatch'
    runs-on: ${{ matrix.runs-on }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows, platform: x86_64, compiler: msvc, config: Release, python: "3.10", flags: "unit-test,test-examples,crashpad", runs-on: { labels: [Windows, X64, nvrgfx-kernelvm-bridge] } }
          - { os: linux, platform: x86_64, compiler: gcc, config: Release, python: "3.10", flags: "unit-test,test-examples,crashpad", runs-on: { labels: [Linux, X64, nvrgfx-kernelvm-bridge] } }

    env:
      CI_OS: ${{ matrix.os }}
      CI_PLATFORM: ${{ matrix.platform }}
      CI_COMPILER: ${{ matrix.compiler }}
      CI_CONFIG: ${{ matrix.config }}
      CI_PYTHON: ${{ matrix.python }}
      CI_FLAGS: ${{ matrix.flags }}
      SLANG_PATH: ${{ github.workspace }}/slang/build/${{ matrix.config }}/bin

    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
          lfs: true

      # A Slang change that breaks SlangPy is a chicken-and-egg problem: neither side
      # compiles against the other until both have landed. Slang CI names the matching
      # SlangPy PR in the dispatch payload, and we merge it in here so both halves are
      # tested together. See SLANGPY_CHERRY_PICK_PR in ci-slangpy-trigger-test.yml in
      # shader-slang/slang.
      #
      # This only affects the checkout for this run; nothing is pushed.
      # Runs through github-script rather than a `run:` block because the Windows
      # runners in this matrix have no `bash`, and the logic is not worth maintaining
      # twice in bash and PowerShell. `exec` invokes `git` straight from PATH -- that
      # resolves on every runner in the matrix -- so no shell is involved at all.
      #
      # This needs no Node on the machine: the Actions runner bundles its own, which
      # is what already runs actions/checkout (itself a node24 JavaScript action) in
      # the step above. v8 is pinned because it targets that same node24.
      - name: Cherry-pick SlangPy PR
        if: github.event.client_payload.slangpy_cherry_pick_pr
        uses: actions/github-script@v8
        env:
          SLANGPY_PR: ${{ github.event.client_payload.slangpy_cherry_pick_pr }}
        with:
          script: |
            const raw = process.env.SLANGPY_PR ?? '';
            // Trim leading and trailing whitespace only. Whitespace *inside* the value
            // has to survive so that a malformed "12 34" fails the digit check below
            // instead of collapsing into 1234 and cherry-picking a different PR.
            const pr = raw.trim();

            // An empty value means "nothing to cherry-pick", not an error. Slang CI
            // sends this field empty whenever no cherry-pick is active, and older
            // Slang CI does not send it at all, so both must behave exactly like an
            // ordinary run.
            if (pr === '') {
              core.info('No SlangPy PR to cherry-pick; building this branch as-is');
              return;
            }

            // A non-empty value crosses a repository boundary, so validate it here
            // rather than trusting the sender.
            if (!/^[0-9]+$/.test(pr)) {
              core.setFailed(`Invalid SlangPy PR number to cherry-pick: '${raw}'`);
              return;
            }

            // exec.exec rejects on a non-zero exit, so any git failure below fails the
            // step, as `set -e` did before.
            await exec.exec('git', ['config', 'user.name', 'slangpy-ci']);
            await exec.exec('git', ['config', 'user.email', 'slangpy-ci@users.noreply.github.com']);

            // actions/checkout leaves a depth-1 clone by default, which has no ancestry
            // for the merge to find a merge base in; without this the merge below fails
            // with "refusing to merge unrelated histories". Deepening only here keeps
            // the ordinary, non-cherry-picked runs on the cheap shallow checkout.
            //
            // --no-recurse-submodules because only this repository's history is needed
            // to find that merge base. Recursing made the fetch also walk the
            // submodules, where a recorded commit that has since been force-pushed away
            // upstream fails the whole step with "remote error: upload-pack: not our
            // ref". actions/checkout has already placed the submodules this build needs.
            const shallow = await exec.getExecOutput('git', ['rev-parse', '--is-shallow-repository']);
            if (shallow.stdout.trim() === 'true') {
              await exec.exec('git', ['fetch', '--unshallow', '--no-recurse-submodules', 'origin']);
            }

            // --force because these jobs run on reused self-hosted workspaces, where a
            // slangpy-pr-under-test ref left behind by an earlier run will not
            // fast-forward to a different PR and would fail the fetch.
            await exec.exec('git', ['fetch', '--force', '--no-recurse-submodules', 'origin', `pull/${pr}/head:slangpy-pr-under-test`]);
            await exec.exec('git', ['merge', '--no-edit', 'slangpy-pr-under-test']);

            core.notice(`Merged SlangPy PR #${pr} into main for this run`);

      - uses: ./.github/actions/build-and-test-with-slang
        with:
          os: ${{ matrix.os }}
          platform: ${{ matrix.platform }}
          compiler: ${{ matrix.compiler }}
          config: ${{ matrix.config }}
          python: ${{ matrix.python }}
          flags: ${{ matrix.flags }}
          shell: ${{ matrix.os == 'windows' && 'pwsh' || 'bash' }}
          slang-checkout-mode: ${{ github.event.client_payload.slang_checkout_mode || 'pr' }}
          slang-pr-number: ${{ github.event.client_payload.slang_pr_number }}
          slang-ref: ${{ github.event.client_payload.slang_ref }}
          slang-repo: ${{ github.event.client_payload.slang_checkout_repo || 'shader-slang/slang' }}

  # Post aggregate status to Slang PR after all matrix jobs complete
  report-status:
    runs-on: ubuntu-latest
    needs: build-pr
    if: always() && github.event_name == 'repository_dispatch'
    steps:
      - name: Post status to Slang PR
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.SLANG_STATUS_TOKEN }}
          script: |
            const result = '${{ needs.build-pr.result }}';
            const state = result === 'success' ? 'success' : 'failure';
            const description = result === 'success'
              ? 'All SlangPy tests passed'
              : `SlangPy tests ${result}`;
            await github.rest.repos.createCommitStatus({
              owner: 'shader-slang',
              repo: 'slang',
              sha: '${{ github.event.client_payload.slang_commit_sha }}',
              state,
              context: 'SlangPy Tests',
              description,
              target_url: '${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}'
            });

  # Notify Slack after all matrix jobs complete
  notify:
    runs-on: ubuntu-latest
    needs: build
    if: always() && github.event_name == 'schedule'
    steps:
      # Success Notification
      - name: Success Notification
        if: ${{ needs.build.result == 'success' }}
        uses: slackapi/slack-github-action@v2.1.1
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload: |
            text: ":green-check-mark: SlangPy nightly status: success\n"

      # Failure Notification
      - name: Failure Notification
        if: ${{ needs.build.result != 'success' }}
        uses: slackapi/slack-github-action@v2.1.1
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload: |
            text: ":alert: :alert: :alert: :alert: :alert: :alert:\nSlangPy nightly status: ${{ needs.build.result }}: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
