name: backfill-benchmark
run-name: "backfill-benchmark: ${{ inputs.target_sha }} (${{ inputs.commit_date }})"

on:
  workflow_dispatch:
    inputs:
      target_sha:
        description: "Exact historical main commit to benchmark"
        required: true
        type: string
      commit_date:
        description: "Commit date for display (YYYY-MM-DD)"
        required: false
        type: string

permissions:
  contents: read
  checks: write
  id-token: write

jobs:
  build:
    runs-on: ${{ matrix.runs-on }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows, linux]
        config: [Release]
        python: ["3.10"]
        include:
          - { os: windows, platform: x86_64, compiler: msvc, config: Release, flags: "benchmark", runs-on: { labels: [Windows, X64, nvrgfx-perf-kernelvm-bridge] } }
          - { os: linux, platform: x86_64, compiler: gcc, config: Release, flags: "benchmark", runs-on: { labels: [Linux, X64, nvrgfx-perf-kernelvm-bridge] } }

    env:
      CI_OS: ${{ matrix.os }}
      CI_PLATFORM: ${{ matrix.platform }}
      CI_COMPILER: ${{ matrix.compiler }}
      CI_CONFIG: ${{ matrix.config }}
      CI_PYTHON: ${{ matrix.python }}
      CI_FLAGS: ${{ matrix.flags }}
      BACKFILL_TARGET_SHA: ${{ inputs.target_sha }}
      BACKFILL_FLOOR_SHA: f3ad0fd91d8cf4eeb2be3b505765b43482aa952a
      BENCHVIEW_API_URL: ${{ vars.BENCHVIEW_API_URL }}
      BENCHVIEW_API_KEY: ${{ secrets.BENCHVIEW_API_KEY }}
      BENCHVIEW_BENCHMARK_REF: ${{ inputs.target_sha }}
      BENCHVIEW_BENCHMARK_BRANCH: main

    steps:
      - name: Set clone directory (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          "BACKFILL_CLONE_DIR=${{ runner.temp }}/slangpy-backfill-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.os }}" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Set clone directory (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: echo "BACKFILL_CLONE_DIR=${{ runner.temp }}/slangpy-backfill-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.os }}" >> "$GITHUB_ENV"

      - name: Setup Python ${{ matrix.python }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}

      - name: Setup MSVC
        uses: step-security/msvc-dev-cmd@v1

      - name: Setup CMake/Ninja
        uses: lukka/get-cmake@latest

      - name: Clone historical source
        run: |
          git clone --recursive "https://github.com/${{ github.repository }}.git" "${{ env.BACKFILL_CLONE_DIR }}"
          git -C "${{ env.BACKFILL_CLONE_DIR }}" checkout --detach "${{ inputs.target_sha }}"

      - name: Validate supported history boundary
        run: |
          echo "Validating target ${{ inputs.target_sha }} against earliest supported commit ${{ env.BACKFILL_FLOOR_SHA }}"
          git -C "${{ env.BACKFILL_CLONE_DIR }}" merge-base --is-ancestor "${{ env.BACKFILL_FLOOR_SHA }}" "${{ inputs.target_sha }}"

      # The dispatching branch can be rewritten while a run is queued, so the run's
      # own commit is not guaranteed to be present in the fresh clone.
      - name: Resolve benchmark harness commit (Windows)
        if: runner.os == 'Windows'
        working-directory: ${{ env.BACKFILL_CLONE_DIR }}
        shell: pwsh
        run: |
          $ErrorActionPreference = "Continue"
          $sha = "${{ github.sha }}"
          git cat-file -e "$sha^{commit}" 2>$null
          if ($LASTEXITCODE -ne 0) {
            git fetch --no-tags origin $sha 2>$null
            if ($LASTEXITCODE -ne 0) {
              Write-Host "Harness commit $sha is unavailable; using ${{ github.ref_name }}."
              git fetch --no-tags origin "${{ github.ref_name }}"
              if ($LASTEXITCODE -ne 0) { throw "Cannot resolve a benchmark harness commit." }
            }
            $sha = (git rev-parse FETCH_HEAD).Trim()
          }
          Write-Host "Benchmark harness commit: $sha"
          "BACKFILL_HARNESS_SHA=$sha" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Resolve benchmark harness commit (Linux)
        if: runner.os == 'Linux'
        working-directory: ${{ env.BACKFILL_CLONE_DIR }}
        shell: bash
        run: |
          set -euo pipefail
          if git cat-file -e "${{ github.sha }}^{commit}" 2>/dev/null; then
            harness="${{ github.sha }}"
          elif git fetch --no-tags origin "${{ github.sha }}"; then
            harness="$(git rev-parse FETCH_HEAD)"
          else
            echo "Harness commit ${{ github.sha }} is unavailable; using ${{ github.ref_name }}."
            git fetch --no-tags origin "${{ github.ref_name }}"
            harness="$(git rev-parse FETCH_HEAD)"
          fi
          echo "Benchmark harness commit: $harness"
          echo "BACKFILL_HARNESS_SHA=$harness" >> "$GITHUB_ENV"

      - name: Synchronize historical submodules and LFS
        working-directory: ${{ env.BACKFILL_CLONE_DIR }}
        run: |
          git submodule sync --recursive
          git submodule update --init --recursive
          git lfs pull

      - name: Setup historical Python environment
        working-directory: ${{ env.BACKFILL_CLONE_DIR }}
        run: |
          python -m pip install -r requirements-dev.txt
          python -m pip install -r samples/requirements.txt
          python -m pip install pytest-github-actions-annotate-failures

      - name: Setup PyTorch environment
        working-directory: ${{ env.BACKFILL_CLONE_DIR }}
        run: |
          python -m pip install torch==2.8.0 torchvision torchaudio --index-url https://download.pytorch.org/whl/cu128

      - name: Historical setup
        working-directory: ${{ env.BACKFILL_CLONE_DIR }}
        run: python tools/ci.py setup

      # MSYS2 deletes superseded packages, so vcpkg revisions pinned before dba4ce18
      # request an msys2-runtime that no longer exists and cannot bootstrap pkgconf.
      # Only those targets are repinned; anything already on the harness revision is
      # built exactly as it was committed. This has to run after "Historical setup",
      # because setup.bat/setup.sh reset every submodule to its recorded revision.
      - name: Repin unbootstrappable vcpkg (Windows)
        if: runner.os == 'Windows'
        working-directory: ${{ env.BACKFILL_CLONE_DIR }}
        shell: pwsh
        run: |
          $harnessVcpkg = (git rev-parse "$env:BACKFILL_HARNESS_SHA`:external/vcpkg").Trim()
          $targetVcpkg = (git rev-parse "HEAD`:external/vcpkg").Trim()
          if ($targetVcpkg -ne $harnessVcpkg) {
            Write-Host "Replacing unbootstrappable vcpkg $targetVcpkg with $harnessVcpkg"
            git -C external/vcpkg fetch --no-tags origin $harnessVcpkg
            if ($LASTEXITCODE -ne 0) { git -C external/vcpkg fetch --no-tags origin }
            git -C external/vcpkg checkout --detach $harnessVcpkg
            if ($LASTEXITCODE -ne 0) { throw "Cannot use the harness vcpkg revision." }
          } else {
            Write-Host "Target already pins the harness vcpkg revision $targetVcpkg"
          }

      - name: Repin unbootstrappable vcpkg (Linux)
        if: runner.os == 'Linux'
        working-directory: ${{ env.BACKFILL_CLONE_DIR }}
        shell: bash
        run: |
          set -euo pipefail
          harness_vcpkg="$(git rev-parse "$BACKFILL_HARNESS_SHA:external/vcpkg")"
          target_vcpkg="$(git rev-parse "HEAD:external/vcpkg")"
          if [ "$target_vcpkg" != "$harness_vcpkg" ]; then
            echo "Replacing unbootstrappable vcpkg $target_vcpkg with $harness_vcpkg"
            git -C external/vcpkg fetch --no-tags origin "$harness_vcpkg" \
              || git -C external/vcpkg fetch --no-tags origin
            git -C external/vcpkg checkout --detach "$harness_vcpkg"
          else
            echo "Target already pins the harness vcpkg revision $target_vcpkg"
          fi

      - name: Historical configure
        working-directory: ${{ env.BACKFILL_CLONE_DIR }}
        run: python tools/ci.py configure

      - name: Historical build
        working-directory: ${{ env.BACKFILL_CLONE_DIR }}
        run: python tools/ci.py build

      # Kept on one line so it runs under both pwsh and bash. slangpy/benchmarks is
      # overlaid as well, both because older benchmarks predate device isolation and
      # because timings are only comparable across commits if the benchmark
      # definitions are held fixed.
      - name: Overlay current BenchView benchmark harness
        working-directory: ${{ env.BACKFILL_CLONE_DIR }}
        run: git checkout "${{ env.BACKFILL_HARNESS_SHA }}" -- tools/ci.py tools/gpu_clock.py slangpy/testing/benchmark slangpy/testing/helpers.py slangpy/testing/plugin.py slangpy/testing/crashpad.py slangpy/benchmarks

      - name: Install slangpy-torch bridge when present
        working-directory: ${{ env.BACKFILL_CLONE_DIR }}
        run: python tools/ci.py install-slangpy-torch

      - name: Benchmark historical source (Windows)
        if: runner.os == 'Windows'
        working-directory: ${{ env.BACKFILL_CLONE_DIR }}
        run: python tools/ci.py benchmark-python --run-id "${{ github.run_id }}" --api-url "${{ env.BENCHVIEW_API_URL }}" --lock-gpu-clocks

      - name: Benchmark historical source (Linux)
        if: runner.os == 'Linux'
        working-directory: ${{ env.BACKFILL_CLONE_DIR }}
        run: python tools/ci.py benchmark-python --run-id "${{ github.run_id }}" --api-url "${{ env.BENCHVIEW_API_URL }}" --lock-gpu-clocks

      - name: Uninstall slangpy-torch
        if: always()
        run: python -m pip uninstall slangpy-torch -y
        continue-on-error: true

      - name: Safely remove temporary clone (Windows)
        if: always() && runner.os == 'Windows'
        shell: pwsh
        run: |
          $candidate = [IO.Path]::GetFullPath($env:BACKFILL_CLONE_DIR).TrimEnd([IO.Path]::DirectorySeparatorChar, [IO.Path]::AltDirectorySeparatorChar)
          $runnerTemp = [IO.Path]::GetFullPath($env:RUNNER_TEMP).TrimEnd([IO.Path]::DirectorySeparatorChar, [IO.Path]::AltDirectorySeparatorChar)
          $parent = [IO.Directory]::GetParent($candidate)
          $name = [IO.Path]::GetFileName($candidate)
          if ($null -eq $parent -or -not [StringComparer]::OrdinalIgnoreCase.Equals($parent.FullName, $runnerTemp)) {
            throw "Refusing to remove clone outside runner.temp: $candidate"
          }
          if (-not $name.StartsWith("slangpy-backfill-", [StringComparison]::Ordinal)) {
            throw "Refusing to remove unexpected directory name: $name"
          }
          if (Test-Path -LiteralPath $candidate) {
            Remove-Item -LiteralPath $candidate -Recurse -Force
          }

      - name: Safely remove temporary clone (Linux)
        if: always() && runner.os == 'Linux'
        shell: bash
        run: |
          candidate="$(realpath -m -- "$BACKFILL_CLONE_DIR")"
          runner_temp="$(realpath -m -- "$RUNNER_TEMP")"
          if [[ "$(dirname -- "$candidate")" != "$runner_temp" ]]; then
            echo "Refusing to remove clone outside runner.temp: $candidate" >&2
            exit 1
          fi
          if [[ "$(basename -- "$candidate")" != slangpy-backfill-* ]]; then
            echo "Refusing to remove unexpected directory name: $(basename -- "$candidate")" >&2
            exit 1
          fi
          rm -rf -- "$candidate"
