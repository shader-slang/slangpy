name: backfill-benchmark
run-name: "backfill-benchmark: ${{ inputs.batch_label || 'rev list' }}"

on:
  workflow_dispatch:
    inputs:
      target_shas:
        description: "Historical main commits to benchmark, whitespace or comma separated"
        required: true
        type: string
      batch_label:
        description: "Short label for the run list (for display only)"
        required: false
        type: string

permissions:
  contents: read
  checks: write
  id-token: write

jobs:
  build:
    runs-on: ${{ matrix.runs-on }}
    # A batch of 30 commits is about 5 hours on Windows, which is uncomfortably
    # close to the 6 hour default. Whatever the job does not reach is reported
    # rather than lost, but there is no reason to cut it short.
    timeout-minutes: 720
    strategy:
      fail-fast: false
      matrix:
        os: [windows, linux]
        config: [Release]
        python: ["3.10"]
        include:
          - { os: windows, platform: x86_64, compiler: msvc, config: Release, flags: "benchmark", runs-on: { labels: [Windows, X64, nvrgfx-perf-kernelvm-bridge] } }
          - { os: linux, platform: x86_64, compiler: gcc, config: Release, flags: "benchmark", runs-on: { labels: [Linux, X64, nvrgfx-perf-kernelvm-bridge] } }

    env:
      CI_OS: ${{ matrix.os }}
      CI_PLATFORM: ${{ matrix.platform }}
      CI_COMPILER: ${{ matrix.compiler }}
      CI_CONFIG: ${{ matrix.config }}
      CI_PYTHON: ${{ matrix.python }}
      CI_FLAGS: ${{ matrix.flags }}
      BACKFILL_FLOOR_SHA: f3ad0fd91d8cf4eeb2be3b505765b43482aa952a
      BENCHVIEW_API_URL: ${{ vars.BENCHVIEW_API_URL }}
      BENCHVIEW_API_KEY: ${{ secrets.BENCHVIEW_API_KEY }}
      BENCHVIEW_BENCHMARK_BRANCH: main

    steps:
      # The harness checkout supplies the driver, the files overlaid onto every
      # historical tree, and the vcpkg revision known to still bootstrap.
      - uses: actions/checkout@v6

      # runner.temp is not available in the job-level env block, so these paths have
      # to be published here rather than declared alongside the other variables.
      - name: Set backfill paths (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          "BACKFILL_CLONE_DIR=${{ runner.temp }}/slangpy-backfill-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.os }}" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "BACKFILL_SKIP_BENCHMARKS=${{ runner.temp }}/backfill-skip-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.os }}.txt" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Set backfill paths (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          echo "BACKFILL_CLONE_DIR=${{ runner.temp }}/slangpy-backfill-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.os }}" >> "$GITHUB_ENV"
          echo "BACKFILL_SKIP_BENCHMARKS=${{ runner.temp }}/backfill-skip-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.os }}.txt" >> "$GITHUB_ENV"

      - name: Setup Python ${{ matrix.python }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}

      - name: Setup MSVC
        uses: step-security/msvc-dev-cmd@v1

      - name: Setup CMake/Ninja
        uses: lukka/get-cmake@latest

      # PyTorch is pinned, so it is installed once for the whole batch rather than
      # per commit. Everything that varies with the target is installed in the loop.
      - name: Setup PyTorch environment
        run: |
          python -m pip install torch==2.8.0 torchvision torchaudio --index-url https://download.pytorch.org/whl/cu128
          python -m pip install pytest-github-actions-annotate-failures

      # Cloned once and then checked out per commit; the queue wait this run is
      # amortising dwarfs the clone, but there is no reason to repeat it either.
      - name: Clone historical source
        run: git clone --recursive "https://github.com/${{ github.repository }}.git" "${{ env.BACKFILL_CLONE_DIR }}"

      # The rev list is handed over in the environment rather than on the command
      # line so that this one step is written once for both pwsh and bash. The
      # driver writes its progress table to $GITHUB_STEP_SUMMARY after every
      # commit, and also prints it, so the log records the outcome either way.
      - name: Benchmark historical commits
        env:
          BACKFILL_TARGET_SHAS: ${{ inputs.target_shas }}
        run: >
          python tools/backfill_batch.py
          --clone-dir "${{ env.BACKFILL_CLONE_DIR }}"
          --floor-sha "${{ env.BACKFILL_FLOOR_SHA }}"
          --skip-manifest "${{ env.BACKFILL_SKIP_BENCHMARKS }}"
          --run-id "${{ github.run_id }}"
          --api-url "${{ env.BENCHVIEW_API_URL }}"

      - name: Uninstall slangpy-torch
        if: always()
        run: python -m pip uninstall slangpy-torch -y
        continue-on-error: true

      - name: Safely remove temporary clone (Windows)
        if: always() && runner.os == 'Windows'
        shell: pwsh
        run: |
          $candidate = [IO.Path]::GetFullPath($env:BACKFILL_CLONE_DIR).TrimEnd([IO.Path]::DirectorySeparatorChar, [IO.Path]::AltDirectorySeparatorChar)
          $runnerTemp = [IO.Path]::GetFullPath($env:RUNNER_TEMP).TrimEnd([IO.Path]::DirectorySeparatorChar, [IO.Path]::AltDirectorySeparatorChar)
          $parent = [IO.Directory]::GetParent($candidate)
          $name = [IO.Path]::GetFileName($candidate)
          if ($null -eq $parent -or -not [StringComparer]::OrdinalIgnoreCase.Equals($parent.FullName, $runnerTemp)) {
            throw "Refusing to remove clone outside runner.temp: $candidate"
          }
          if (-not $name.StartsWith("slangpy-backfill-", [StringComparison]::Ordinal)) {
            throw "Refusing to remove unexpected directory name: $name"
          }
          if (Test-Path -LiteralPath $candidate) {
            Remove-Item -LiteralPath $candidate -Recurse -Force
          }

      - name: Safely remove temporary clone (Linux)
        if: always() && runner.os == 'Linux'
        shell: bash
        run: |
          candidate="$(realpath -m -- "$BACKFILL_CLONE_DIR")"
          runner_temp="$(realpath -m -- "$RUNNER_TEMP")"
          if [[ "$(dirname -- "$candidate")" != "$runner_temp" ]]; then
            echo "Refusing to remove clone outside runner.temp: $candidate" >&2
            exit 1
          fi
          if [[ "$(basename -- "$candidate")" != slangpy-backfill-* ]]; then
            echo "Refusing to remove unexpected directory name: $(basename -- "$candidate")" >&2
            exit 1
          fi
          rm -rf -- "$candidate"
