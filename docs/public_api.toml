# Reviewed public API contract for the structured documentation pipeline.
#
# The named sections preserve the curated legacy SGL API. Reachable names outside
# these names and narrowly scoped patterns remain review candidates and are not
# published automatically.

schema_version = 1
package = "slangpy"
version_source = "src/sgl/sgl.h"
show_missing_documentation = true

